name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/qolha
            rm -f .github/workflows/deploy.yml
            git fetch origin main
            git reset --hard origin/main
            cd server
            npm ci
            PM2=$(command -v pm2 || echo "/usr/local/bin/pm2")
            if [ ! -x "$PM2" ]; then
              npx pm2 restart qolha --update-env
            else
              "$PM2" restart qolha --update-env
            fi
