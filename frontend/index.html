<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>قلها</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-label="قلها">
      <p class="brand">قلها</p>
      <h1>رتّب فكرتك للذكاء الاصطناعي</h1>
      <p class="lede">اكتب بطريقتك… وسنحوّلها إلى طلب أوضح وأذكى.</p>
    </section>

    <section class="app-card" aria-label="تجهيز الطلب">
      <form id="processForm">
        <label for="transcript">طلبك</label>
        <textarea id="transcript" placeholder="مثال: أبغى أبدأ مشروع تقني لكن ما أعرف من وين أبدأ…" required></textarea>
        <p class="field-note">اكتب كما تتكلم عادة.</p>
        <button type="submit" id="submitButton">
          <span class="button-spinner" aria-hidden="true"></span>
          <span class="button-text">جهّز الطلب</span>
        </button>
      </form>
    </section>

    <section id="result" class="result-card" aria-live="polite" hidden></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
