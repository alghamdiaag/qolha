<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>قلها</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="brand-label">قلها</p>
      <h1>اكتب طلبك بطريقتك</h1>
      <p class="subheadline">ونرتّبه لك ليصبح جاهزًا للنسخ إلى أي تطبيق ذكاء اصطناعي.</p>
    </header>

    <section class="card input-card" aria-label="إدخال الطلب">
      <form id="processForm">
        <label for="transcript">طلبك</label>
        <textarea id="transcript" placeholder="مثال: أبغى أبدأ مشروع تقني يخدم الناس، لكن ما أعرف من وين أبدأ..." required></textarea>
        <p class="field-hint">اكتب كما تتكلم عادة. لا تحتاج صياغة مثالية.</p>
        <button type="submit" id="submitButton">جهّز الطلب</button>
      </form>
    </section>

    <section id="result" class="card result-card" aria-live="polite" hidden></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
